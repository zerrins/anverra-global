spring:
  application:
    name: anverraglobal-backend
  
  # Spring Modulith configurations
  modulith:
    events:
      jdbc:
        # schema initialization should be managed via Flyway in production

  # Flyway core configuration
  flyway:
    enabled: true
    baseline-on-migrate: true

anverra:
  security:
    oauth2:
      issuer-uri: ${AUTH0_ISSUER_URI:https://dev-tenant.us.auth0.com/}
      audience: ${AUTH0_AUDIENCE:anverra-api}
